version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install uv
      - uv sync --locked --no-default-groups --group docs --extra langgraph --extra observability
    build:
      html:
        - uv run --no-sync zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp --recursive site/. "$READTHEDOCS_OUTPUT/html/"
